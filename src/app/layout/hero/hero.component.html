@let movieData = movie(); @if(movieData){
<div class="relative h-[80vh] w-full">
  <div class="absolute inset-0">
    <img
      src="https://image.tmdb.org/t/p/w500/{{ movieData.backdrop_path }}"
      alt="{{ movieData.title }}"
      class="object-contain w-full h-full"
    />
    <div
      class="absolute inset-0 bg-gradient-to-r from-black via-black/50 to-black"
    ></div>
  </div>

  <div class="relative flex items-center h-full">
    <div class="w-full px-16 md:px-64">
      <h1 class="mb-4 text-3xl font-bold text-white md:text-5xl px-8 md:px-32">
        {{ movieData.title }}
      </h1>
      <p class="mb-8 text-lg text-white px-8 md:px-32">
        {{ movieData.overview }}
      </p>
      <div class="flex flex-col sm:flex-row gap-4 px-8 md:px-32">
        <button
          (click)="verTrailer()"
          class="px-6 py-3 rounded-md bg-netflix-red hover:bg-netflix-red/80 text-white font-semibold transition-colors duration-200 flex items-center justify-center gap-2"
        >
          ▶️ Ver Trailer
        </button>
        <button
          (click)="masInformacion()"
          class="px-6 py-3 rounded-md bg-white/20 hover:bg-white/40 text-white font-semibold transition-colors duration-200"
        >
          Más información
        </button>
      </div>
    </div>
  </div>
</div>
}
